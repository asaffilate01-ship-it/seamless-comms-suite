name: Read-only source review evidence
on:
  push:
    branches: [feature/dishbee-factory-audit-20261005]
    paths: [.github/workflows/review-source-evidence.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot committed source only; no application or deployment execution
        shell: bash
        run: |
          set -euo pipefail
          git show-ref > "$RUNNER_TEMP/review-refs.txt"
          git bundle create "$RUNNER_TEMP/review-source.bundle" --all
          git bundle verify "$RUNNER_TEMP/review-source.bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source-evidence
          path: |
            ${{ runner.temp }}/review-source.bundle
            ${{ runner.temp }}/review-refs.txt
          retention-days: 1
          if-no-files-found: error
