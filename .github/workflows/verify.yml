name: Verify Omniqora integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Public release smoke contract tests
        run: node --test verification/public-smoke.test.mjs
      - name: Provisioning worker preflight and manual-drain safety
        run: bun test verification/control-plane/provisioning-preflight.test.ts
      - name: Provider onboarding directory and manual-health isolation
        run: bun test verification/control-plane/connector-onboarding.test.ts
      - name: Twilio masked voice, signature and tenant isolation gates
        run: bun test verification/control-plane/masked-voice.test.ts
      - name: Twilio inbound ordering identity and SMS/WhatsApp safety
        run: bun test verification/control-plane/twilio-order-intake.test.ts
      - name: Sales cadence, isolation and suppression regressions
        run: |
          node verification/control-plane/sales-runtime.test.mjs
          node verification/control-plane/sales-queue-fairness.test.mjs
      - run: bun run build
      - run: bun run typecheck
      - name: Build four local-language TraveNexa UK travel storefronts
        run: bun run build:travel-sites
      - name: Typecheck the market-specific travel app
        run: bun run typecheck:travel-sites
      - name: Verify market isolation, no false supplier availability and redirects
        run: bun run test:travel-sites
      - run: bun run test:security
      - name: Growth runtime, tenant isolation and product gateway
        run: bun run test:growth
      - run: bun run test:bridges
      - run: bun run test:mobile
      - run: bun run test:procurement
      - name: Portfolio source, SaaS and tenant blueprint inventory
        run: node --test verification/control-plane/portfolio-expansion.test.mjs
      - name: Property matching agent and safe activation contract
        run: node --test verification/control-plane/property-matching.test.mjs
      - name: MCP setup and atomic AI budgets safety contracts
        run: node --test verification/control-plane/agent-factory-phase2.test.mjs
      - run: bun run test:control-plane
      - run: bun run test:automotive-auctions
      - run: bun run test:automotive-bids
      - run: bun run test:automotive-intelligence
      - run: bun run test:services
      - run: node --test services/ecosystem-core/tests/*.test.mjs
      - name: Native PostgreSQL adapter and forced RLS
        run: |
          python -m pip install 'pgserver==0.1.4' 'psycopg[binary]>=3.2,<4'
          python verification/business360/test_postgres.py
      - name: Standalone build
        working-directory: apps/business360-standalone
        run: |
          npm ci --no-audit --no-fund
          npm run build
