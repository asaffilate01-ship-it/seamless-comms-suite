name: Verify Omniqora integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm run test:bridges
      - run: npm run test:mobile
      - run: npm run test:procurement
      - run: npm run test:services
      - run: node --test services/ecosystem-core/tests/*.test.mjs
      - name: Native PostgreSQL adapter and forced RLS
        run: |
          python -m pip install 'pgserver==0.1.4' 'psycopg[binary]>=3.2,<4'
          python verification/business360/test_postgres.py
      - name: Standalone build
        working-directory: apps/business360-standalone
        run: |
          npm ci --no-audit --no-fund
          npm run build
