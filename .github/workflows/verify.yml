name: Verify Omniqora integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CLI product client and two-tenant HTTP integration
        run: node --test adapters/cli-documents/*.test.mjs
      - name: CLI document pilot isolation and portfolio contracts
        run: python3 -m unittest discover -s services/cli-automation/tests -v
      - run: bun install --frozen-lockfile
      - name: Perplexity provider and durable research allowance checks
        run: |
          bun test verification/control-plane/perplexity-research.test.ts
          node --test verification/control-plane/perplexity-research.database.test.mjs
      - name: CRM routing hosted-schema inventory and drift regression
        run: node --test verification/routing/*.test.mjs
      - name: EventPlanr country and entitlement boundaries
        run: node --test verification/eventplanr/*.test.mjs
      - name: Public release smoke contract tests
        run: node --test verification/public-smoke.test.mjs
      - name: Provisioning worker preflight and manual-drain safety
        run: bun test verification/control-plane/provisioning-preflight.test.ts
      - name: Provider onboarding directory and manual-health isolation
        run: bun test verification/control-plane/connector-onboarding.test.ts
      - name: Connector Intelligence redaction and inert code generation
        run: node --test verification/control-plane/connector-intelligence.test.mjs
      - name: Connector Intelligence Phase 2 MCP proposals and quarantine gates
        run: node --test verification/control-plane/connector-qualification.test.mjs
      - name: Twilio masked voice, signature and tenant isolation gates
        run: bun test verification/control-plane/masked-voice.test.ts
      - name: Twilio inbound ordering identity and SMS/WhatsApp safety
        run: bun test verification/control-plane/twilio-order-intake.test.ts
      - name: Sales cadence, isolation and suppression regressions
        run: |
          node verification/control-plane/sales-runtime.test.mjs
          node verification/control-plane/sales-queue-fairness.test.mjs
      - name: CricLume provider, worker and MCP boundaries
        run: node --test verification/control-plane/criclume-worker.test.mjs
      - run: bun run build
      - run: bun run typecheck
      - name: Build four local-language TraveNexa UK travel storefronts
        run: bun run build:travel-sites
      - name: Typecheck the market-specific travel app
        run: bun run typecheck:travel-sites
      - name: Verify market isolation, no false supplier availability and redirects
        run: bun run test:travel-sites
      - name: Verify TraveNexa tenant-isolated landlord supplier gateway
        run: bun run test:travel-core
      - run: bun run test:security
      - name: Growth runtime, tenant isolation and product gateway
        run: bun run test:growth
      - run: bun run test:bridges
      - run: bun run test:mobile
      - run: bun run test:procurement
      - name: Portfolio source, SaaS and tenant blueprint inventory
        run: node --test verification/control-plane/portfolio-expansion.test.mjs
      - name: Property matching agent and safe activation contract
        run: node --test verification/control-plane/property-matching.test.mjs
      - name: Agent run history scope and cancellation
        run: node --test verification/agent-operations/*.test.mjs
      - name: MCP setup and atomic AI budgets safety contracts
        run: node --test verification/control-plane/agent-factory-phase2.test.mjs
      - name: Governed AI Workforce configuration and tenant isolation
        run: node --test verification/control-plane/ai-workforce-phase3.test.mjs
      - name: AI Workforce task review and locked execution safety
        run: node --test verification/control-plane/ai-workforce-phase4a.test.mjs
      - name: AI Workforce synthetic sandbox and no-model worker
        run: node --test verification/control-plane/ai-workforce-phase4b.test.mjs
      - name: AI Workforce read-only model pilot request, usage and no-tool guards
        run: node --test verification/control-plane/ai-workforce-phase4c.test.mjs
      - name: AI Workforce first-party CRM consent, budget, read-only worker and metered review
        run: node --test verification/control-plane/ai-workforce-phase4d.test.mjs
      - name: AI Workforce operator worker allowlist, stale-charge quarantine and stop controls
        run: node --test verification/control-plane/ai-workforce-phase4e.test.mjs
      - name: AI Workforce shadow team role isolation and no-execution handoffs
        run: node --test verification/control-plane/ai-workforce-phase5a.test.mjs
      - name: Ruflo isolated MCP sandbox and tenant RLS gates
        run: node --test services/ruflo-bridge/ruflo-bridge.test.mjs verification/control-plane/ruflo-pilot-contract.test.mjs
      - name: Ruflo scoped probe worker, lease and audit tests
        run: node --test services/ruflo-bridge/worker-core.test.mjs verification/control-plane/ruflo-probe-worker-contract.test.mjs
      - name: Ruflo Phase 8–9 MCP manifest pin and synthetic multi-agent verifier
        run: node --test services/ruflo-bridge/manifest-attestation.test.mjs services/ruflo-bridge/shadow-missions.test.mjs verification/control-plane/ruflo-phase8-9.test.mjs
      - name: Ruflo Phase 10–12 staged authorisation, emergency stop and receipt safety
        run: |
          node --test verification/control-plane/ruflo-phase10-12.test.mjs verification/control-plane/ruflo-runtime-interlocks.test.mjs
          bun test verification/control-plane/ruflo-readiness.test.ts
      - run: bun run test:control-plane
      - run: bun run test:automotive-auctions
      - run: bun run test:automotive-bids
      - run: bun run test:automotive-intelligence
      - run: bun run test:automotive-history
      - run: bun run test:services
      - run: node --test services/ecosystem-core/tests/*.test.mjs
      - name: Native PostgreSQL adapter and forced RLS
        run: |
          python -m pip install 'pgserver==0.1.4' 'psycopg[binary]>=3.2,<4'
          python verification/business360/test_postgres.py
      - name: Standalone build
        working-directory: apps/business360-standalone
        run: |
          npm ci --no-audit --no-fund
          npm run build
