name: Isolated repair workspace
on:
  push:
    branches: [fix/haccora-readiness-reviewed-20261005]
    paths: [.github/workflows/repair-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Prepare locked dependencies without lifecycle or deployment scripts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          git diff --exit-code
          git bundle create "$RUNNER_TEMP/source.bundle" --all
          tar -czf "$RUNNER_TEMP/dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-repair-workspace
          path: |
            ${{ runner.temp }}/source.bundle
            ${{ runner.temp }}/dependencies.tar.gz
          retention-days: 1
          if-no-files-found: error
